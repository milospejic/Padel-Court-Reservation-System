apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyReceivesReady": true }'
      labels:
        app: review-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: review-service
          image: milospejic001/review-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx192m"
            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/review_db
            - name: SPRING_R2DBC_USERNAME
              value: "postgres"
            - name: SPRING_R2DBC_PASSWORD
              value: "postgres"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:file:/app/config/application.yml,optional:file:/app/config/review-service.yml"
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          readinessProbe:
                      httpGet:
                        path: /actuator/health
                        port: 8083
                      initialDelaySeconds: 120 
                      periodSeconds: 10
                      failureThreshold: 5
          volumeMounts:
                  - name: config-volume
                    mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: config-repo