apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: inject-user-id-header
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
            subFilter:
              name: "envoy.filters.http.router"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.lua
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
          inlineCode: |
            function envoy_on_request(request_handle)
              local meta = request_handle:streamInfo():dynamicMetadata():get("envoy.filters.http.jwt_authn")
              if meta then
                local claims = meta["payload"]
                if claims then
                  if claims["sub"] then
                    request_handle:headers():add("logged-in-user-id", claims["sub"])
                  end
                  if claims["role"] then
                    request_handle:headers():add("logged-in-user-role", claims["role"])
                  end
                end
              end
            end