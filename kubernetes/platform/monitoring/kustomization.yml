apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: istio-system

resources:
  - https://raw.githubusercontent.com/istio/istio/release-1.20/samples/addons/prometheus.yaml
  - mailhog.yml
  - alertmanager.yml
  - prometheus-rules.yml

patches:
  - path: prometheus-deployment-patch.yml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: prometheus

  - path: prometheus-config.yml
    target:
      version: v1
      kind: ConfigMap
      name: prometheus