apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'mailhog:1025'
      smtp_from: 'alertmanager@padel-system.com'
      smtp_require_tls: false

    route:
      receiver: 'email-notifications'
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

    receivers:
    - name: 'email-notifications'
      email_configs:
      - to: 'admin@padel-system.com'
        send_resolved: true
        headers:
          Subject: '{{ .Status | toUpper }}: {{ .CommonAnnotations.summary }}'
        
        html: '
          <h2>System Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Status:</strong> {{ .Status | toUpper }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <hr>
          <h3>Technical Details:</h3>
          <ul>
          {{ range .Alerts }}
            <li>
              <strong>Severity:</strong> {{ .Labels.severity }}<br>
              <strong>Service:</strong> {{ .Labels.destination_app }}<br>
              <strong>Namespace:</strong> {{ .Labels.source_workload_namespace }}<br>
              <strong>Pod:</strong> {{ .Labels.pod }}
            </li>
          {{ end }}
          </ul>
        '

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.25.0
        args:
          - "--config.file=/etc/alertmanager/alertmanager.yml"
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: config-volume
          mountPath: /etc/alertmanager
      volumes:
      - name: config-volume
        configMap:
          name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093